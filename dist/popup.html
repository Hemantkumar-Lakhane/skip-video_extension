<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Companion</title>
    <link rel="stylesheet" href="ui/popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Video controller</p>
          <h1>Study Skipper</h1>
        </div>
      </header>

      <section class="video-card">
        <div class="status-row">
          <span id="status" class="status">Checking page...</span>
          <span id="timeText" class="time-text">--:-- / --:--</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="primary-grid">
          <button id="playBtn" class="primary">Play / Pause</button>
          <button id="endBtn" class="danger">Skip To End</button>
        </div>

        <div class="jump-grid">
          <button class="jump-btn" data-seconds="-30">-30s</button>
          <button class="jump-btn" data-seconds="30">+30s</button>
          <button class="jump-btn" data-seconds="120">+2m</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Speed</div>
        <div class="speed-grid">
          <button class="speed-btn" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="1.5">1.5x</button>
          <button class="speed-btn" data-speed="2">2x</button>
          <button class="speed-btn" data-speed="4">4x</button>
          <button class="speed-btn" data-speed="8">8x</button>
          <button class="speed-btn" data-speed="16">16x</button>
        </div>
      </section>

      <section class="panel compact">
        <div class="tool-grid">
          <button id="muteBtn">Mute</button>
          <button id="focusBtn">Focus</button>
          <button id="nextBtn">Next</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Settings</div>
        
        <label for="defaultSpeed">Default video speed</label>
        <select id="defaultSpeed" style="margin-bottom: 12px;">
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
          <option value="16">16x</option>
        </select>

        <div class="setting-row" style="margin-bottom: 12px;">
          <div>
            <label for="autoMute">Auto mute videos</label>
            <p>Mute the lesson video when controls are applied.</p>
          </div>
          <input type="checkbox" id="autoMute" />
        </div>

        <div class="setting-row" style="margin-bottom: 12px;">
          <div>
            <label for="focusDefault">Start with focus mode</label>
            <p>Hide common sidebars and sticky panels.</p>
          </div>
          <input type="checkbox" id="focusDefault" />
        </div>

        <div class="setting-row" style="margin-bottom: 12px;">
          <div>
            <label for="autoNext">Auto play next</label>
            <p>Automatically click next when a video finishes playing.</p>
          </div>
          <input type="checkbox" id="autoNext" />
        </div>

        <div class="setting-row">
          <div>
            <label for="autoReading">Auto complete readings</label>
            <p>Mark readings as complete and go to next after 10s.</p>
          </div>
          <input type="checkbox" id="autoReading" />
        </div>

        <button id="saveBtn" class="save-btn">Save Settings</button>
        <p id="saveStatus" class="status-msg"></p>
      </section>
    </main>
    <script src="scripts/popup.js"></script>
  </body>
</html>
